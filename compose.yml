services:
  # --- BANCOS DE DADOS ---
  db_postgres:
    image: postgres:15-alpine
    container_name: db_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_postgres_data:/var/lib/postgresql/data
    networks:
      - ezband_network

  db_mongo:
    image: mongo:6
    container_name: db_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - db_mongo_data:/data/db
    networks:
      - ezband_network

  db_evolution:
    image: postgres:15-alpine
    container_name: db_evolution
    environment:
      POSTGRES_USER: ${EVO_DB_USER}
      POSTGRES_PASSWORD: ${EVO_DB_PASSWORD}
      POSTGRES_DB: evolution_db
    ports:
      - "5433:5432"
    volumes:
      - db_evolution_data:/var/lib/postgresql/data
    networks:
      - ezband_network

  # --- INFRA E MENSAGERIA ---
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio
    ports:
      - "9005:9000"   # Alterado para 9005 para evitar conflito
      - "9090:9090"   # Console Web
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ADMIN_PASSWORD}
    command: "server /data --console-address :9090"
    networks:
      - ezband_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - ezband_network

  # --- SERVIÇOS EXTERNOS ---
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8082}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_TYPE=apikey
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${EVO_DB_USER}:${EVO_DB_PASSWORD}@db_evolution:5432/evolution_db?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
    depends_on:
      - db_evolution
    networks:
      - ezband_network

  # --- SUAS APLICAÇÕES ---
  api:
    build:
      context: ./EzBand-Backend
    container_name: api
    restart: unless-stopped
    depends_on:
      - db_postgres
      - evolution-api
    env_file: .env
    environment:
      # Uso do nome do serviço 'db_postgres' em vez de localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_postgres:5432/${POSTGRES_DB}
      EVOLUTION_API_URL: http://evolution-api:8080
    ports:
      - "8080:8080"
    volumes:
      - ./EzBand-Backend:/app # Permite Hot Reload se o seu Dockerfile suportar
      - app_logs:/app/logs
    networks:
      - ezband_network

  chat-service:
    build: ./ChatService
    container_name: chat-service
    restart: unless-stopped
    depends_on:
      - db_mongo
    env_file: .env
    environment:
      # Conexão interna via nome do container
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db_mongo:27017/${MONGO_DB_DATABASE}?authSource=admin
    ports:
      - "3001:3001"
    volumes:
      - ./ChatService:/app
      - /app/node_modules
    networks:
      - ezband_network

  backup:
    build: ./BackupService
    container_name: backup
    env_file: .env
    depends_on:
      - db_postgres
      - db_mongo
      - minio
    networks:
      - ezband_network

volumes:
  db_postgres_data:
  db_mongo_data:
  db_evolution_data:
  minio_data:
  app_logs:
  evolution_data:
  evolution_store:

networks:
  ezband_network:
    driver: bridge