services:
  # BANCOS DE DADOS
  db_postgres:
    image: postgres
    container_name: db_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_postgres_data:/var/lib/postgresql/data
    networks:
      - ezband_app_network
  
  db_mongo:
    image: mongo
    container_name: db_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    volumes:
      - db_mongo_data:/data/db
    networks:
      - ezband_app_network

  # STORAGE
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio
    ports:
      - "9000:9000"   # API S3
      - "9090:9090"   # Console web
    volumes:
      - minio_data:/data
    networks:
      - ezband_app_network
    environment:
      MINIO_ROOT_USER: ${MINIO_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ADMIN_PASSWORD}
    command: "server /data --console-address :9090"

  # MENSAGERIA
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ezband_app_network
    volumes:
      - redis_data:/data

  db_evolution:
    image: postgres:15-alpine
    container_name: db_evolution
    environment:
      POSTGRES_USER: ${EVO_DB_USER}
      POSTGRES_PASSWORD: ${EVO_DB_PASSWORD}
      POSTGRES_DB: evolution_db
    ports:
      - "5433:5432" # Porta 5433 no seu Windows, 5432 interna
    volumes:
      - db_evolution_data:/var/lib/postgresql/data
    networks:
      - ezband_app_network

  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8081}
      - REDIS_ENABLED=true
      # - REDIS_URI=redis://redis:6379
      - REDIS_PREFIX_KEY=evolution
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${EVO_DB_USER}:${EVO_DB_PASSWORD}@db_evolution:5432/evolution_db?schema=public
      - PORT=8081
    depends_on:
      - redis
      - db_evolution
    networks:
      - ezband_app_network
    volumes:
      - evolution_data:/evolution/instances

  # APLICACOES
  chat-service:
    build: ./ChatService # caminho do seu microservice
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: db_mongo://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db_mongo:27017/chat?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    depends_on:
      - db_mongo
    networks:
      - ezband_app_network

     # MinIO secundário (armazenamento dos backups)

  api:
    build: 
      context: ./EzBand-Backend
      dockerfile: Dockerfile
    container_name: api
    profiles: ["debug"]
    depends_on:
      - db_postgres
      - evolution-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8081}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-ezband-whatsapp}
    ports:
      - "8080:8080"
    networks:
      - ezband_app_network
    volumes:
      - app_logs:/app/logs

  # BACKUP 
  backup:
    build: ./BackupService
    container_name: backup
    depends_on:
      - db_postgres
      - db_mongo
      - minio
    volumes:
      - db_postgres_data:/data/postgres:ro
      - db_mongo_data:/data/mongo:ro
      - app_logs:/data/logs:ro
      - ./backup-temp:/backup
    environment:
      MINIO_ADMIN_USER: ${MINIO_ADMIN_USER}
      MINIO_ADMIN_PASSWORD: ${MINIO_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    networks:
      - ezband_app_network


volumes:
  db_postgres_data:
  app_logs:
  db_mongo_data:
  minio_data:
  redis_data:
  evolution_data:
  db_evolution_data:

networks:
  ezband_app_network:
    driver: bridge
