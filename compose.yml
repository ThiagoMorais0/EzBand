services:
  # BANCOS DE DADOS
  db_postgres:
    image: postgres
    container_name: db_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_postgres_data:/var/lib/postgresql/data
    networks:
      - ezband_app_network
  
  db_mongo:
    image: mongo
    container_name: db_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    volumes:
      - db_mongo_data:/data/db
    networks:
      - ezband_app_network

  # STORAGE
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio
    ports:
      - "9000:9000"   # API S3
      - "9090:9090"   # Console web
    volumes:
      - minio_data:/data
    networks:
      - ezband_app_network
    environment:
      MINIO_ROOT_USER: ${MINIO_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ADMIN_PASSWORD}
    command: "server /data --console-address :9090"

  # APLICACOES
  chat-service:
    build: ./ChatService # caminho do seu microservice
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: db_mongo://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db_mongo:27017/chat?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    depends_on:
      - db_mongo
    networks:
      - ezband_app_network

     # MinIO secundário (armazenamento dos backups)

  api:
    build: 
      context: ./EzBand-Backend
      dockerfile: Dockerfile
    container_name: api
    depends_on:
      - db_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - ezband_app_network
    volumes:
      - app_logs:/app/logs

  # BACKUP 
  backup:
    build: ./BackupService
    container_name: backup
    depends_on:
      - db_postgres
      - db_mongo
      - minio
    volumes:
      - db_postgres_data:/data/postgres:ro
      - db_mongo_data:/data/mongo:ro
      - app_logs:/data/logs:ro
      - ./backup-temp:/backup
    environment:
      MINIO_ADMIN_USER: ${MINIO_ADMIN_USER}
      MINIO_ADMIN_PASSWORD: ${MINIO_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    networks:
      - ezband_app_network


volumes:
  db_postgres_data:
  app_logs:
  db_mongo_data:
  minio_data:

networks:
  ezband_app_network:
    driver: bridge