services:
  # BANCOS DE DADOS
  db:
    image: postgres
    container_name: ezband_db_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - ezband_app_network
  
  mongodb:
    image: mongo
    container_name: chat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    volumes:
      - mongo-data:/data/db
    networks:
      - ezband_app_network

  # STORAGE
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio
    ports:
      - "9000:9000"   # API S3
      - "9090:9090"   # Console web
    volumes:
      - minio_data:/data
    networks:
      - ezband_app_network
    environment:
      MINIO_ROOT_USER: ${MINIO_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ADMIN_PASSWORD}
    command: "server /data --console-address :9090"

  # APLICACOES
  chat-service:
    build: ./ChatService # caminho do seu microservice
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/chat?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    depends_on:
      - mongodb
    networks:
      - ezband_app_network

     # MinIO secundário (armazenamento dos backups)

  api:
    build: 
      context: ./EzBand-Backend
      dockerfile: Dockerfile
    container_name: ezband_backend_dev
    depends_on:
      - db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - ezband_app_network
    volumes:
      - app_logs_dev:/app/logs

  # BACKUP 
  backup:
    build: ./BackupService
    container_name: ezband_backup
    depends_on:
      - db
      - mongodb
      - minio
    volumes:
      - postgres_data_dev:/data/postgres:ro
      - mongo-data:/data/mongo:ro
      - app_logs_dev:/data/logs:ro
      - ./backup-temp:/backup
    environment:
      MINIO_ADMIN_USER: ${MINIO_ADMIN_USER}
      MINIO_ADMIN_PASSWORD: ${MINIO_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    networks:
      - ezband_app_network


volumes:
  postgres_data_dev:
  app_logs_dev:
  mongo-data:
  minio_data:

networks:
  ezband_app_network:
    driver: bridge