services:
  # BANCOS DE DADOS
  db-postgres:
    image: postgres:16
    container_name: db-postgres
    hostname: db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-postgres_data:/var/lib/postgresql/data
    networks:
      - ezband_app_network

  db-mongo:
    image: mongo
    container_name: db-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    volumes:
      - db-mongo_data:/data/db
    networks:
      - ezband_app_network

  # STORAGE
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio_data:/data
    networks:
      ezband_app_network:
        aliases:
          - ezband-storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ADMIN_PASSWORD}
    command: "server /data --console-address :9090"

  # MENSAGERIA
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ezband_app_network
    volumes:
      - redis_data:/data

  db_evolution:
    image: postgres:15-alpine
    container_name: db_evolution
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVO_DB_USER}
      POSTGRES_PASSWORD: ${EVO_DB_PASSWORD}
      POSTGRES_DB: evolution_db
    ports:
      - "5433:5432"
    volumes:
      - db_evolution_data:/var/lib/postgresql/data
    networks:
      - ezband_app_network

  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8082}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_TYPE=apikey
      - CONFIG_SESSION_PHONE_CLIENT=To Fix
      - CONFIG_SESSION_PHONE_VERSION=
      - CONFIG_SESSION_PHONE_STRATEGY=latest
      - CHROME_ARGS=--no-sandbox --disable-setuid-sandbox --disable-gpu --disable-dev-shm-usage
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${EVO_DB_USER}:${EVO_DB_PASSWORD}@db_evolution:5432/evolution_db?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - WEBSOCKET_ENABLED=true
      - QRCODE_LIMIT=30
    depends_on:
      - db_evolution
    networks:
      - ezband_app_network
    volumes:
      - evolution_data:/evolution/instances
      - evolution_store:/evolution/store

  # APLICAÇÕES
  chat-service:
    build: ./ChatService
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db-mongo:27017/chat?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    depends_on:
      - db-mongo
    networks:
      - ezband_app_network

  api:
    build:
      context: ./EzBand-Backend
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    depends_on:
      - db-postgres
      - evolution-api
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - ezband_app_network
    volumes:
      - app_logs:/app/logs

  # FRONT-END (VUE.JS)
  frontend:
    build:
      context: ./EzBand-Web
      dockerfile: Dockerfile
    container_name: ezband-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - chat-service
    networks:
      - ezband_app_network

  backup:
    build: ./BackupService
    container_name: backup
    restart: unless-stopped
    depends_on:
      - db-postgres
      - db-mongo
      - minio
    volumes:
      - db-postgres_data:/data/postgres:ro
      - db-mongo_data:/data/mongo:ro
      - app_logs:/data/logs:ro
      - ./backup-temp:/backup
    environment:
      MINIO_ADMIN_USER: ${MINIO_ADMIN_USER}
      MINIO_ADMIN_PASSWORD: ${MINIO_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB_DATABASE: ${MONGO_DB_DATABASE}
    networks:
      - ezband_app_network

volumes:
  db-postgres_data:
  app_logs:
  db-mongo_data:
  minio_data:
  redis_data:
  evolution_data:
  evolution_store:
  db_evolution_data:

networks:
  ezband_app_network:
    driver: bridge
