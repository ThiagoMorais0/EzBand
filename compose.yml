services:
  db:
    image: postgres
    container_name: ezband_db_dev
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - ezband_app_network
  
  api:
    build: 
      context: ./EzBand-Backend
      dockerfile: Dockerfile
    container_name: ezband_backend_dev
    depends_on:
      - db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8080:8080"
    networks:
      - ezband_app_network
    volumes:
      - app_logs_dev:/app/logs

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API S3
      - "9090:9090"   # Console web
    volumes:
      - ~/minio/data:/data
    env_file: .env
    networks:
      - ezband_app_network
    environment:
      MINIO_ROOT_USER: ${MINIO_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ADMIN_PASSWORD}
    command: server /data --console-address ":9090"
    
volumes:
  postgres_data_dev:
  app_logs_dev:

networks:
  ezband_app_network:
    driver: bridge
