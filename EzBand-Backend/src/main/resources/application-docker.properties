spring.datasource.url=jdbc:postgresql://db-postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.jpa.hibernate.ddl-auto=update

# Flyway Configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.jpa.open-in-view=false
api.security.token.secret=${JWT_SECRET}

# logger
logging.file.name=/app/logs/app.log
logging.level.root=INFO
logging.level.com.baseapplication.core=ERROR
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=10

minio.user=${MINIO_ADMIN_USER}
minio.password=${MINIO_ADMIN_PASSWORD}
minio.internal-url=http://minio:9000
minio.external-url=https://ezband.cloud/storage
minio.bucket-name=profilepictures,bandlogos,bandbanners,venuelogo,studiologo,equipamento,userposts


google.client.id=${GOOGLE_CLIENT_ID:684814793329-9pgakej97ah85h4tmg4vi88vdcfncdmt.apps.googleusercontent.com}

spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

spotify.client-id=${SPOTIFY_CLIENT}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET}

# ============================================
# EVOLUTION API - WhatsApp Integration
# ============================================

evolution.api.url=${EVOLUTION_API_URL}

# Chave de API configurada no Evolution API
evolution.api.key=${EVOLUTION_API_KEY}

# Nome da inst�ncia WhatsApp (deve ser �nico por ambiente)
evolution.instance.name=${EVOLUTION_INSTANCE_NAME:ezband-whatsapp}

# ============================================
# RETRY CONFIGURATION
# ============================================
spring.retry.enabled=true
server.forward-headers-strategy=FRAMEWORK

# ============================================
# VAPID - Web Push Notifications
# ============================================
vapid.public-key=${VAPID_PUBLIC_KEY}
vapid.private-key=${VAPID_PRIVATE_KEY}
vapid.subject=${VAPID_SUBJECT:mailto:thiagomface@gmail.com}