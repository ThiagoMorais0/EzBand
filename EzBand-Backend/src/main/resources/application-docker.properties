spring.datasource.url=jdbc:postgresql://ezband-api-db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.jpa.hibernate.ddl-auto=validate

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.jpa.open-in-view=true
api.security.token.secret=${JWT_SECRET}

# logger
logging.file.name=/app/logs/app.log
logging.level.root=INFO
logging.level.com.baseapplication.core=ERROR
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=10

minio.user=${MINIO_ADMIN_USER}
minio.password=${MINIO_ADMIN_PASSWORD}

spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=1800000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=1800000

spotify.client-id=${SPOTIFY_CLIENT}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET}

# ============================================
# EVOLUTION API - WhatsApp Integration
# ============================================

evolution.api.url=${EVOLUTION_API_URL}

# Chave de API configurada no Evolution API
evolution.api.key=${EVOLUTION_API_KEY}

# Nome da instância WhatsApp (deve ser único por ambiente)
evolution.instance.name=${EVOLUTION_INSTANCE_NAME:ezband-whatsapp}

# ============================================
# RETRY CONFIGURATION
# ============================================
spring.retry.enabled=true
