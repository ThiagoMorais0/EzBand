<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Chat 1x1</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>
    <h1>Token</h1>
    <input type="text" id="token">
    <h1>Chat 1x1</h1>
    <div>
        <label>ID:</label>
        <input id="id" placeholder="ex: 1">
        <label>Tipo:</label>
        <input id="type" placeholder="ex: user">
        <button onclick="register()">Registrar</button>
    </div>

    <div>
        <label>Destinatário ID:</label>
        <input id="rid">
        <label>Tipo:</label>
        <input id="rtype">
        <label>Mensagem:</label>
        <input id="msg">
        <button onclick="send()">Enviar</button>
    </div>

    <div id="log"></div>

    <script>
        const token = document.getElementById('token').value;

        const socket = io({
            auth: { token }
        });

        function log(msg) {
            document.getElementById("log").innerHTML += `<p>${msg}</p>`;
        }

        function register() {
            const id = document.getElementById("id").value;
            const type = document.getElementById("type").value;
            socket.emit('register', { id, type });
            log(`Registrado como ${type}:${id}`);
        }

        function send() {
            const sender = {
                id: document.getElementById("id").value,
                type: document.getElementById("type").value
            };
            const receiver = {
                id: document.getElementById("rid").value,
                type: document.getElementById("rtype").value
            };
            const text = document.getElementById("msg").value;

            socket.emit('sendMessage', { sender, receiver, text });
            log(`Enviado para ${receiver.type}:${receiver.id} -> ${text}`);
        }

        socket.on("connect_error", (err) => {
            console.error("Erro de conexão:", err.message);
        });

        socket.on('receiveMessage', (msg) => {
            log(`📩 De ${msg.sender.type}:${msg.sender.id} -> ${msg.text}`);
        });
    </script>
</body>

</html>
