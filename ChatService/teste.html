<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Chat 1x1 - Teste WebSocket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
        }

        input,
        button,
        textarea {
            padding: 6px;
            margin: 4px 0;
            width: 100%;
        }

        #messages {
            border: 1px solid #ccc;
            height: 200px;
            overflow-y: auto;
            padding: 5px;
            background: #fafafa;
        }

        .msg {
            margin: 5px 0;
        }

        .me {
            color: blue;
        }

        .other {
            color: green;
        }

        .system {
            color: gray;
            font-style: italic;
        }
    </style>
</head>

<body>
    <h2>Chat 1x1 - Teste WebSocket</h2>

    <label>Token JWT:</label>
    <input id="token" type="text" placeholder="Cole seu JWT aqui" />

    <label>tipoID:</label>
    <input id="tipoId" type="text" placeholder="tipo ID remetente" />

    <button onclick="connect()">Conectar</button>

    <h3>Mensagens</h3>
    <div id="messages"></div>

    <h3>Enviar mensagem</h3>
    <label>Destinatário (ex: user:2, banda:1):</label>
    <input id="to" type="text" placeholder="tipo:id" />

    <label>Mensagem:</label>
    <textarea id="msg"></textarea>
    <button onclick="sendMessage()">Enviar</button>

    <script>
        let socket;

        function connect() {
            const token = document.getElementById("token").value.trim();
            const tipoId = document.getElementById("tipoId").value.trim();
            if (!token) {
                alert("Insira um token JWT válido!");
                return;
            }

            socket = new WebSocket(`ws://localhost:3001/?token=${token}&tipoId=${tipoId}`);

            socket.onopen = () => {
                addMessage("Conectado ao servidor!", "system");
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.system) {
                    addMessage(data.system, "system");
                } else {
                    const who = data.from || "desconhecido";
                    addMessage(`${who}: ${data.msg}`, who === "me" ? "me" : "other");
                }
            };

            socket.onclose = () => {
                addMessage("Conexão fechada.", "system");
            };

            socket.onerror = (err) => {
                addMessage("Erro na conexão: " + err.message, "system");
            };
        }

        function sendMessage() {

            if (!socket || socket.readyState !== WebSocket.OPEN) {
                alert("Conecte-se primeiro!");
                return;
            }

            const from = document.getElementById("tipoId").value.trim();
            const to = document.getElementById("to").value.trim();
            const msg = document.getElementById("msg").value.trim();

            if (!to || !msg) {
                alert("Preencha destinatário e mensagem!");
                return;
            }

            socket.send(JSON.stringify({ type: "message", from, to, msg }));
            addMessage(`Você -> ${to}: ${msg}`, "me");
            document.getElementById("msg").value = "";
        }

        function addMessage(text, cls) {
            const div = document.createElement("div");
            div.className = "msg " + cls;
            div.textContent = text;
            document.getElementById("messages").appendChild(div);
            document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
        }
    </script>
</body>

</html>
