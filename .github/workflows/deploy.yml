name: Deploy Backend

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Evita dois deploys simultâneos brigando pelos mesmos containers
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 5022
          sync: true
          timeout: 90s
          command_timeout: 22m
          script: |
            set -e

            # O remote do backend é HTTPS, então o git fetch não precisa de chave SSH
            cd /root/EzBand

            echo ">> Atualizando código..."
            git fetch origin develop
            git reset --hard origin/develop

            echo ">> Buildando imagem da API (sem cache)..."
            # O build roda antes de derrubar o container antigo, então a API fica no ar durante o build
            docker compose --profile deploy build --no-cache api

            echo ">> Recriando container da API..."
            docker compose --profile deploy rm -sf api
            docker rm -f api 2>/dev/null || true
            docker compose --profile deploy up -d --no-deps api

            echo ">> Verificando saúde da API (aguardando até 180s)..."
            # Qualquer resposta HTTP abaixo de 500 indica que o Spring subiu (a raiz devolve 403 por causa do Spring Security)
            for i in $(seq 1 36); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ 2>/dev/null || true)
              if [ -n "$CODE" ] && [ "$CODE" != "000" ] && [ "$CODE" -lt 500 ]; then
                echo "API respondeu — HTTP $CODE"
                break
              fi
              if [ "$i" -eq 36 ]; then
                echo "ERRO: API não respondeu após 180s (último status: $CODE)"
                echo ">> Logs do container da API:"
                docker logs api --tail 60
                exit 1
              fi
              echo "  Aguardando... ($i/36)"
              sleep 5
            done

            # O nginx resolve o host "api" só na inicialização; o container novo pode ter outro IP
            echo ">> Recarregando nginx do front-end..."
            docker exec ezband-frontend nginx -s reload || docker restart ezband-frontend

            echo ">> Limpando imagens antigas..."
            docker image prune -f

            echo "Deploy concluído com sucesso."
